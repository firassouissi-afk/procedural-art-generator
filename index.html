<!doctype html><meta charset="utf-8"><title>Procedural Art Generator</title>
<style>body{margin:0;background:#09090b;color:white;font-family:Segoe UI}.panel{position:absolute;left:15px;top:15px;background:#18181bcc;padding:15px;border-radius:10px}.panel input{width:160px}.panel button{padding:8px;background:#9333ea;color:white;border:0;border-radius5px}.credit{position:absolute;bottom:10px;width:100%;text-align:center;color:#a1a1aa;font-size:11px}.credit a{color:#c084fc}canvas{display:block}</style>
<canvas id="c"></canvas><div class="panel">Density <input id="density" type="range" min="100" max="1400" value="600"><br>Spread <input id="spread" type="range" min="1" max="30" value="12"><br>Hue <input id="hue" type="range" min="0" max="360" value="280"><br><button id="generate">Generate</button> <button id="save">Download PNG</button></div><div class="credit">Website developed by <a href="https://www.linkedin.com/company/souissi-technologies-development-group/home/">SOUISSI Technologies Development Group (STDG)</a><br>A Development Bureau for AI-Driven IT Projects. From Web Technologies to Autonomous Drones.</div>
<script>
const c=document.querySelector('#c'),ctx=c.getContext('2d');function resize(){c.width=innerWidth;c.height=innerHeight}onresize=resize;resize();
function generate(){ctx.fillStyle='#09090b';ctx.fillRect(0,0,c.width,c.height);const cx=c.width/2,cy=c.height/2,spread=+document.querySelector('#spread').value,hue=+document.querySelector('#hue').value;for(let i=0;i<+density.value;i++){const t=i*.025,noise=Math.sin(t*3.1)+Math.cos(t*.7),r=i*.45+Math.abs(noise)*spread*5,x=cx+Math.cos(t+noise)*r,y=cy+Math.sin(t+noise)*r;ctx.fillStyle=`hsl(${hue+t*8%360} 85% 62% / .8)`;ctx.beginPath();ctx.arc(x,y,1+spread/10,0,7);ctx.fill()}}
generate.onclick=generate;save.onclick=()=>{let a=document.createElement('a');a.download='stdg-procedural-art.png';a.href=c.toDataURL();a.click()};generate();
</script>
